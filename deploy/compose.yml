x-gateway: &gateway
  build: ..
  image: llm-gateway:local
  env_file: [.env.prod, trusted-proxies.env]
  environment:
    # Below mem_limit, so the Go runtime collects harder before the kernel
    # kills the container.
    GOMEMLIMIT: 220MiB
  mem_limit: 256m
  # Past SHUTDOWN_TIMEOUT (25s by default), so the gateway's own drain ends
  # before Docker's SIGKILL. Raise both together.
  stop_grace_period: 35s
  depends_on: [redis]
  restart: unless-stopped

services:
  gateway-a: *gateway
  gateway-b: *gateway
  redis:
    image: redis:8.10-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 192m
    restart: unless-stopped
  caddy:
    image: caddy:2
    env_file: trusted-proxies.env
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env, e.g. DOMAIN=api.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    depends_on: [gateway-a, gateway-b]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
